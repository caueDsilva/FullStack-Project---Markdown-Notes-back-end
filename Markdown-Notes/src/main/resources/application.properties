spring.application.name=Markdown-Notes

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:markdown_notes}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# JWT
api.security.token.secret=${JWT_SECRET:default-secret-key-for-markdown-notes-api-123456}
api.security.token.expiration=${JWT_EXPIRATION:7200000}

# Flyway
spring.flyway.enabled=true

# Server
server.port=${API_PORT:8080}